<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Kelompok</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 640px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    header { padding: 16px; background: #2563eb; color: #fff; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .bot { align-self: flex-start; background: #e5e7eb; color: #111; }
    .error { align-self: center; background: #fee2e2; color: #991b1b; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>🤖 Chatbot Kelompok</header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="Ketik pesan..." autocomplete="off" required />
      <button id="send" type="submit">Kirim</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    addMessage("Halo! Ada yang bisa saya bantu?", "bot");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      history.push({ role: "user", text });
      input.value = "";
      sendBtn.disabled = true;
      const loading = addMessage("Mengetik...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history }),
        });
        const data = await res.json();
        loading.remove();
        if (!res.ok) throw new Error(data.error || "Terjadi kesalahan");
        addMessage(data.reply, "bot");
        history.push({ role: "model", text: data.reply });
      } catch (err) {
        loading.remove();
        addMessage(err.message, "error");
        history.pop(); // buang pesan user yang gagal agar riwayat tetap valid
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
